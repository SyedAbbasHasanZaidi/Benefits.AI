name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # ── Next.js web app ─────────────────────────────────────────────────────────
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter web typecheck

      - name: Lint
        run: pnpm --filter web lint

  # ── FastAPI rules service ───────────────────────────────────────────────────
  rules:
    name: Rules service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/rules/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests -v
