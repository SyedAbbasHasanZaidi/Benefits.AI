app            = "benefits-ai-rules"
primary_region = "syd"

[build]
  dockerfile = "apps/rules/Dockerfile"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

[env]
  PORT = "8000"
