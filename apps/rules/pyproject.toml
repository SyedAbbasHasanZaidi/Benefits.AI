[project]
name = "benefits-ai-rules"
version = "0.1.0"
description = "Benefits.AI rules engine — FastAPI + OpenFisca"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "openfisca-core>=43.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["openfisca_au*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
